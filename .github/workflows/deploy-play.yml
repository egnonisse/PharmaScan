name: Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Track cible (internal = équipe, closed = test fermé 14j, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - closed
          - production
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket_scanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane

      # --- Secrets : clé service account, keystore, key.properties ---
      - name: Decode service account key
        run: |
          echo "${{ secrets.PLAY_UPLOADER_KEY_JSON }}" | base64 --decode > play-uploader-key.json

      - name: Decode upload keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 --decode > android/app/scanapp-upload-keystore.jks

      - name: Write key.properties
        run: |
          mkdir -p android
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=scanapp-upload-keystore.jks" >> android/key.properties

      - name: Run tests
        run: flutter test

      # Cache Gradle : réutilise les artefacts Kotlin/Maven entre les runs
      # (moins de requêtes réseau → évite les 429 de Maven Central + builds
      # plus rapides).
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Upload (${{ github.event.inputs.track || 'internal' }})
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          # Upload des debug symbols vers Sentry à chaque build release
          # (crashs lisibles en clair). Token : secret GitHub.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.track }}" = "production" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            bundle exec fastlane android deploy_production
          elif [ "${{ github.event.inputs.track }}" = "closed" ]; then
            bundle exec fastlane android deploy_closed
          else
            bundle exec fastlane android deploy_internal
          fi
